name: Diabetes Prediction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py app1.py train_model.py

      - name: Verify dataset
        run: |
          python -c "import pandas as pd; df=pd.read_csv('diabetes.csv'); assert len(df) > 0; print('Dataset loaded:', df.shape)"
