name: Diabetes Prediction CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py app1.py train_model.py

      - name: Verify dataset
        run: |
          python -c "import pandas as pd; df=pd.read_csv('diabetes.csv'); assert len(df)>0; print('Dataset shape:', df.shape)"

      - name: Train ML model
        run: python train_model.py

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-prediction-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-prediction-api:${{ github.sha }}
